<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tachyon News — Market News Intelligence</title>
  <meta name="description" content="Sector-grouped market news with AI extraction, evidence verification and a daily AI market brief.">
  <meta name="theme-color" content="#07090c">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before first paint (no flash).
    try {
      var t = localStorage.getItem('tsn.theme');
      if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <div class="app" id="app">
    <!-- ───────────── top bar ───────────── -->
    <header class="topbar">
      <a class="brand" href="#/overview" aria-label="Tachyon News home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 17l5-6 4 4 8-10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="brand-text"><b>TACHYON NEWS</b><small>MARKET NEWS INTELLIGENCE</small></span>
      </a>

      <button class="search-trigger" type="button" data-action="palette" aria-label="Search (Ctrl K)">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Search tickers, sectors, stories…</span>
        <kbd id="kbd-hint">Ctrl K</kbd>
      </button>

      <div class="topbar-right">
        <div class="market-pill" id="market-pill" aria-live="polite"></div>
        <span class="clock mono" id="clock" title="New York time">--:--:-- ET</span>
        <button class="icon-btn" type="button" data-action="refresh" aria-label="Refresh data" title="Refresh (R)">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" type="button" data-action="theme" aria-label="Toggle light/dark theme" title="Theme (T)">
          <svg class="i-sun" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" type="button" data-action="help" aria-label="Keyboard shortcuts" title="Shortcuts (?)">
          <span class="mono" aria-hidden="true">?</span>
        </button>
      </div>
    </header>

    <div class="tape" aria-label="Market tape"><div class="tape-track" id="tape"></div></div>
    <div class="banner" id="banner" hidden></div>

    <!-- ───────────── shell ───────────── -->
    <div class="shell">
      <nav class="rail" id="rail" aria-label="Primary"></nav>
      <main class="main" id="main" tabindex="-1"></main>
      <aside class="inspector" id="inspector" aria-label="Details" hidden></aside>
    </div>

    <nav class="tabbar" id="tabbar" aria-label="Views"></nav>
  </div>

  <div class="scrim" id="scrim" hidden data-action="close-inspector"></div>
  <div class="overlay" id="palette" hidden></div>
  <div class="overlay" id="help" hidden></div>
  <div class="overlay" id="chart-modal" hidden></div>
  <div class="popover" id="popover" role="tooltip" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
