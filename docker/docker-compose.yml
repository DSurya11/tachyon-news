
services:
  postgres:
    image: postgres:16-alpine
    container_name: stocknews-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stocknews
    ports:
      - "127.0.0.1:5432:5432"   # loopback only — never expose the dev password to the LAN
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stocknews"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pg_data:
    driver: local
