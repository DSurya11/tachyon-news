[project]
name = "stock-news-pipeline"
version = "1.0.0"
description = "Hourly Finviz news pipeline with LLM extraction, daily AI market report and a public dashboard API"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["venv", "frontend", "htmlcov"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DTZ", "RUF", "PIE", "BLE"]
ignore = [
    "B008",    # FastAPI's Depends()/Query() in defaults is idiomatic
    "RUF001",  # ambiguous unicode in strings (curly quotes are intentional test data)
    "RUF002",
    "RUF003",
    "E501",    # long SQL/log lines are clearer unwrapped
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ", "BLE"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline", "backend", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["pipeline", "backend"]
omit = ["pipeline/report/claude_web.py"]
