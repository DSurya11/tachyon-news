name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stocknews
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LOCAL_DB_URL: postgresql://postgres:postgres@localhost:5432/stocknews
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium   # for the real-browser dashboard test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/tachyon-news/package-lock.json
      - name: Build the dashboard (the e2e test drives the built app)
        run: npm ci && npm run build
        working-directory: frontend/tachyon-news
      - run: ruff check pipeline backend tests
      - run: pytest -q --cov --cov-report=term

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/tachyon-news
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/tachyon-news/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
